<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>New Memo Creation</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#d0bb95",
              "background-light": "#f7f7f6",
              "background-dark": "#1d1a15",
              "text-light-primary": "#1d1a15",
              "text-light-secondary": "#888888",
              "text-dark-primary": "#f7f7f6",
              "text-dark-secondary": "#888888",
              "input-light": "#edeceb",
              "input-dark": "#2a2721"
            },
            fontFamily: {
              "display": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display">
<div class="relative flex h-screen w-full flex-col bg-background-light dark:bg-background-dark group/design-root overflow-hidden">
<!-- Top App Bar -->
<div class="flex items-center justify-between px-4 py-2 bg-background-light dark:bg-background-dark">
<button class="flex size-12 shrink-0 items-center justify-start text-text-light-secondary dark:text-text-dark-secondary">
<span class="material-symbols-outlined text-3xl">close</span>
</button>
<button class="flex items-center justify-end px-4 py-2">
<p class="text-primary text-lg font-bold leading-normal tracking-wide">Done</p>
</button>
</div>
<!-- Spacer -->
<div class="h-4 bg-background-light dark:bg-background-dark"></div>
<!-- Main Content Area -->
<div class="flex flex-1 flex-col justify-between px-4">
<!-- Text Input Fields -->
<div class="flex flex-1 flex-col">
<textarea autofocus="" class="flex w-full min-w-0 flex-1 resize-none overflow-y-auto rounded-none text-text-light-primary dark:text-text-dark-primary focus:outline-none focus:ring-0 border-none bg-transparent p-0 text-lg font-normal leading-relaxed placeholder:text-text-light-secondary dark:placeholder:text-text-dark-secondary" placeholder="Start typing..."></textarea>
<div class="flex-shrink-0 py-3">
<input class="form-input w-full min-w-0 resize-none overflow-hidden rounded-lg text-text-light-primary dark:text-text-dark-primary focus:outline-none focus:ring-2 focus:ring-primary/50 border-none bg-input-light dark:bg-input-dark h-14 placeholder:text-text-light-secondary dark:placeholder:text-text-dark-secondary p-4 text-base font-normal leading-normal" placeholder="Add tags (optional)" value=""/>
</div>
</div>
</div>
<!-- iOS Keyboard Placeholder -->

<div class="w-full bg-center bg-no-repeat bg-cover group-[.dark]/design-root:hidden" data-alt="Light theme iOS keyboard" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuBrXT0RjVaKS8dleIspIpZC9Hyips_O4gksrr3VoBZRcRZzjNdZCgHIANuXe29z0Dd51pSRa876HrI16GYywcgnnxRMJqViaNvfBGgGIhNa-UYnpwi-3zyUNZu6AoYH-Xlnhy5gFcMTTF9_FztpxQj-ToLhJQnjqme9WXif4JGl8-CoUipeCiIvexzJFEzBFIB3TS_1KPd3gnuxgiRF186Y8uiFniC9pVyGhcuOLuMgyIF7pS3BNwxgbBj6B12WLOWPV1rL6oZUNOw"); aspect-ratio: 390 / 291;'></div>

</div>
</div>
