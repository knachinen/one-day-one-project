<!DOCTYPE html>

<html class="" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Search Results</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@400&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            font-size: 24px;
        }
    </style>
<script id="tailwind-config">tailwind.config = {darkMode: "class", theme: {extend: {colors: {primary: "#D0BB95", "background-light": "#f7f7f6", "background-dark": "#1d1a15"}, fontFamily: {display: "Inter"}, borderRadius: {DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px"}}}};</script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden">
<!-- Top App Bar -->
<div class="flex items-center p-4 pb-2 bg-background-light dark:bg-background-dark justify-between">
<div class="text-slate-900 dark:text-white flex size-12 shrink-0 items-center justify-start">
<span class="material-symbols-outlined">arrow_back_ios_new</span>
</div>
<h2 class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Search Results</h2>
<div class="flex size-12 shrink-0 items-center"></div>
</div>
<!-- Search Bar -->
<div class="px-4 py-3 bg-background-light dark:bg-background-dark">
<label class="flex flex-col min-w-40 h-12 w-full">
<div class="flex w-full flex-1 items-stretch rounded-lg h-full">
<div class="text-slate-400 dark:text-[#92adc9] flex border-none bg-slate-200 dark:bg-[#233648] items-center justify-center pl-4 rounded-l-lg border-r-0">
<span class="material-symbols-outlined">search</span>
</div>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-slate-900 dark:text-white focus:outline-0 focus:ring-0 border-none bg-slate-200 dark:bg-[#233648] focus:border-none h-full placeholder:text-slate-400 dark:placeholder:text-[#92adc9] px-4 rounded-l-none border-l-0 pl-2 text-base font-normal leading-normal" placeholder="Search by content or #tag" value="minimalist"/>
</div>
</label>
</div>
<!-- Chips / Tag Filters -->
<div class="flex gap-3 px-4 py-3 overflow-x-auto bg-background-light dark:bg-background-dark">
<div class="flex h-8 shrink-0 items-center justify-center gap-x-2 rounded-full bg-primary pl-4 pr-4"><p class="text-white text-sm font-medium leading-normal">All</p></div>
<div class="flex h-8 shrink-0 items-center justify-center gap-x-2 rounded-full bg-slate-200 dark:bg-[#233648] pl-4 pr-4">
<p class="text-slate-900 dark:text-white text-sm font-medium leading-normal">#idea</p>
</div>
<div class="flex h-8 shrink-0 items-center justify-center gap-x-2 rounded-full bg-slate-200 dark:bg-[#233648] pl-4 pr-4">
<p class="text-slate-900 dark:text-white text-sm font-medium leading-normal">#meeting</p>
</div>
<div class="flex h-8 shrink-0 items-center justify-center gap-x-2 rounded-full bg-slate-200 dark:bg-[#233648] pl-4 pr-4">
<p class="text-slate-900 dark:text-white text-sm font-medium leading-normal">#quote</p>
</div>
<div class="flex h-8 shrink-0 items-center justify-center gap-x-2 rounded-full bg-slate-200 dark:bg-[#233648] pl-4 pr-4">
<p class="text-slate-900 dark:text-white text-sm font-medium leading-normal">#project_alpha</p>
</div>
</div>
<!-- Search Results List -->
<div class="flex flex-col gap-1 pt-4 pb-4 bg-background-light dark:bg-background-dark">
<!-- List Item 1 -->
<div class="flex items-center gap-4 px-4 min-h-[72px] py-2 justify-between">
<div class="flex items-center gap-4 flex-1 min-w-0">
<div class="text-slate-900 dark:text-white flex items-center justify-center rounded-lg bg-slate-200 dark:bg-[#233648] shrink-0 size-12">
<span class="material-symbols-outlined">description</span>
</div>
<div class="flex flex-col justify-center min-w-0">
<p class="text-slate-900 dark:text-white text-base font-medium leading-normal truncate">My brilliant new app idea</p>
<p class="text-slate-500 dark:text-[#92adc9] text-sm font-normal leading-normal truncate">A <span class="bg-primary/30 text-primary-800 dark:text-primary-300 rounded-sm px-0.5">minimalist</span> text archiving app called Paperclip...</p>
</div>
</div>
<div class="shrink-0"><p class="text-slate-500 dark:text-[#92adc9] text-sm font-normal leading-normal">2 days ago</p></div>
</div>
<!-- List Item 2 -->
<div class="flex items-center gap-4 px-4 min-h-[72px] py-2 justify-between">
<div class="flex items-center gap-4 flex-1 min-w-0">
<div class="text-slate-900 dark:text-white flex items-center justify-center rounded-lg bg-slate-200 dark:bg-[#233648] shrink-0 size-12">
<span class="material-symbols-outlined">description</span>
</div>
<div class="flex flex-col justify-center min-w-0">
<p class="text-slate-900 dark:text-white text-base font-medium leading-normal truncate">Project Alpha Design Goals</p>
<p class="text-slate-500 dark:text-[#92adc9] text-sm font-normal leading-normal truncate">Keep the design <span class="bg-primary/30 text-primary-800 dark:text-primary-300 rounded-sm px-0.5">minimalist</span> and clean. #project_alpha</p>
</div>
</div>
<div class="shrink-0"><p class="text-slate-500 dark:text-[#92adc9] text-sm font-normal leading-normal">1 week ago</p></div>
</div>
</div>
